services:
  postgres:
    image: postgres:16
    container_name: github-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: github_assistant
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d github_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: github-assistant-api
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy  
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:

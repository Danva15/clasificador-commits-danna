name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: github_assistant
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d github_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Crear tabla de PostgreSQL
        env:
          PGPASSWORD: app_password
        run: |
          psql -h localhost -U app_user -d github_assistant -f db/init.sql

      - name: Ejecutar pruebas
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: github_assistant
          DB_USER: app_user
          DB_PASSWORD: app_password
        run: npm test

      - name: Verificar sintaxis
        run: node --check src/server.js

  construir:
    runs-on: ubuntu-latest
    needs: calidad

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t clasificador-commits-danna:ci .